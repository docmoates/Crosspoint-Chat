<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Artifact previews load from crosspoint-artifact:// (served by main with its own CSP) inside sandboxed
      iframes without allow-same-origin, so their scripts run but cannot reach this page or the preload.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src crosspoint-artifact:; object-src 'none'; base-uri 'self'"
    />
    <title>Crosspoint Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
